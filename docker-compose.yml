services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: ayvatech-portainer
    profiles: ["portainer"]
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: ayvatech-uptime-kuma
    profiles: ["uptime"]
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data/uptime-kuma:/app/data

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: ayvatech-jellyfin
    profiles: ["jellyfin"]
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ./data/jellyfin/media:/media

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: ayvatech-filebrowser
    profiles: ["files"]
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "8080:80"
    volumes:
      - ./data/filebrowser/root:/srv
      - ./data/filebrowser/database:/database

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ayvatech-homeassistant
    profiles: ["homeassistant"]
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ./data/homeassistant:/config
      - /run/dbus:/run/dbus:ro
